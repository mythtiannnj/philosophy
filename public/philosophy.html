<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Philosophy · Explorer</title>
  <link rel="icon" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/menu.css" />
  <style>
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    header.page-head { text-align: center; margin-bottom: 2.5rem; }
    header.page-head h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    header.page-head p {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent-cyan), transparent);
      margin: 1.3rem auto;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
    }

    /* Search */
    .search-bar { display: flex; justify-content: center; margin-bottom: 2.2rem; }
    .search-wrap { position: relative; width: 100%; max-width: 480px; }
    .search-wrap i {
      position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 0.85rem; pointer-events: none;
      transition: color var(--transition-fast);
    }
    .search-bar input {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 2.8rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.9rem;
      outline: none;
      color: var(--text);
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar input:focus {
      border-color: rgba(34, 211, 238, 0.5);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08), 0 0 30px -8px rgba(34, 211, 238, 0.3);
    }
    .search-wrap:focus-within i { color: var(--accent-cyan); }

    /* Quote block */
    .quote-highlight {
      position: relative;
      border-radius: var(--radius-lg);
      padding: 2.2rem 2.4rem;
      margin-bottom: 2.6rem;
      overflow: hidden;
    }
    .quote-highlight::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 4px; height: 100%;
      background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-blue), transparent);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
    }
    .quote-highlight::after {
      content: '"';
      position: absolute; right: 1.5rem; top: -1.2rem;
      font-family: var(--font-serif);
      font-size: 9rem;
      color: rgba(34, 211, 238, 0.06);
      line-height: 1;
      pointer-events: none; user-select: none;
    }
    .quote-highlight .label {
      font-family: var(--font-mono);
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 1.1rem;
      display: inline-flex; align-items: center; gap: 0.6rem;
    }
    .quote-highlight .label::before {
      content: ''; width: 22px; height: 1px;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
    }
    .quote-highlight blockquote {
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 2.3vw, 1.7rem);
      font-style: italic;
      color: var(--text);
      line-height: 1.5;
      max-width: 90%;
    }
    .quote-highlight .author {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent-cyan);
      font-size: 0.82rem;
      margin-top: 1.1rem;
    }
    .quote-highlight .reference {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-style: italic;
      font-family: var(--font-mono);
    }
    .quote-highlight .refresh-btn {
      position: absolute; top: 1.3rem; right: 1.3rem;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all var(--transition-fast);
      z-index: 2;
    }
    .quote-highlight .refresh-btn:hover {
      color: var(--accent-cyan);
      border-color: rgba(34, 211, 238, 0.4);
      transform: rotate(90deg);
      box-shadow: 0 0 20px -6px rgba(34, 211, 238, 0.5);
    }

    /* Grid title */
    .grid-title {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1.6rem;
    }
    .grid-title::before, .grid-title::after {
      content: ''; width: 40px; height: 1px;
      background: linear-gradient(to right, transparent, var(--text-muted), transparent);
    }

    /* Grid */
    .philosopher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
    }
    .philosopher-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .philosopher-card:hover {
      transform: translateY(-6px);
      border-color: rgba(34, 211, 238, 0.35);
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    .philosopher-card .portrait {
      position: relative;
      width: 100%;
      height: 260px;
      background-size: cover;
      background-position: center top;
      background-color: #0d1422;
    }
    .philosopher-card .portrait::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top,
        rgba(7, 10, 18, 0.98) 0%,
        rgba(7, 10, 18, 0.55) 30%,
        rgba(7, 10, 18, 0.1) 60%,
        transparent 100%);
    }
    .life-badge, .school-badge {
      position: absolute; z-index: 2;
      font-family: var(--font-mono);
      font-size: 0.64rem; font-weight: 700;
      padding: 0.32rem 0.8rem;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      letter-spacing: 0.05em;
      max-width: 70%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .life-badge {
      bottom: 14px; left: 16px;
      background: rgba(15, 21, 35, 0.85);
      color: var(--accent-cyan);
      border: 1px solid rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 20px -6px rgba(34, 211, 238, 0.4);
    }
    .school-badge {
      top: 14px; right: 14px;
      background: rgba(124, 58, 237, 0.22);
      color: #c4b5fd;
      border: 1px solid rgba(167, 139, 250, 0.35);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .philosopher-card .content {
      padding: 1.3rem 1.4rem 1.5rem;
      flex: 1;
      display: flex; flex-direction: column;
    }
    .philosopher-card h3 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }
    .philosopher-card .interests {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent-cyan);
      margin-bottom: 0.85rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .philosopher-card .interests i { margin-right: 0.35rem; opacity: 0.7; }
    .philosopher-card .topical {
      font-style: italic;
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1.55;
      border-left: 2px solid rgba(34, 211, 238, 0.3);
      padding-left: 0.85rem;
      margin-bottom: 1rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .philosopher-card .links {
      display: flex; gap: 0.4rem;
      margin-top: auto; padding-top: 0.85rem;
      border-top: 1px solid rgba(148, 163, 184, 0.08);
      flex-wrap: wrap;
    }
    .philosopher-card .links a {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-dim);
      padding: 0.32rem 0.65rem;
      border: 1px solid var(--border-2);
      border-radius: 7px;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: all var(--transition-fast);
    }
    .philosopher-card .links a:hover {
      color: var(--accent-cyan);
      border-color: rgba(34, 211, 238, 0.45);
      background: rgba(34, 211, 238, 0.08);
    }

    .loading, .error-msg {
      text-align: center;
      padding: 3rem 2rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .error-msg { color: var(--accent-rose); }

    .skeleton {
      background: linear-gradient(90deg,
        rgba(30, 41, 59, 0.4) 25%,
        rgba(51, 65, 85, 0.6) 50%,
        rgba(30, 41, 59, 0.4) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 640px) {
      .philosopher-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
      .philosopher-card .portrait { height: 220px; }
      .quote-highlight { padding: 1.7rem 1.5rem; }
      .quote-highlight::after { font-size: 7rem; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-purple"></div>
  </div>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fas fa-brain"></i></span>
      <div class="brand-text">Philosophy <small>Explorer</small></div>
    </div>
    <div class="topbar-right">
      <div class="theme-toggle" role="tablist" aria-label="Theme">
        <button data-theme="dark" class="active"><i class="fas fa-circle-half-stroke"></i> Dark</button>
        <button data-theme="glass"><i class="fas fa-droplet"></i> Glass</button>
      </div>
      <button class="icon-btn hamburger" id="hamburger-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="menu-line top-line" d="M4 6h16"/>
          <path class="menu-line middle-line" d="M4 12h16"/>
          <path class="menu-line bottom-line" d="M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Navigation">
    <div class="drawer-header">
      <div class="brand">
        <span class="brand-mark"><i class="fas fa-brain"></i></span>
        <div>
          <h2>Philosophy</h2>
          <small>Explorer</small>
        </div>
      </div>
      <button class="icon-btn" id="drawer-close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-label">Navigation</div>
      <nav class="drawer-nav">
        <a href="/">
          <span class="nav-icon"><i class="fas fa-house"></i></span>
          <span class="nav-label">Home <small>Welcome page</small></span>
        </a>
        <a href="/philosophy" class="active">
          <span class="nav-icon"><i class="fas fa-book-open"></i></span>
          <span class="nav-label">Philosophy <small>Explore thinkers</small></span>
        </a>
        <a href="/admin">
          <span class="nav-icon"><i class="fas fa-shield-halved"></i></span>
          <span class="nav-label">Admin <small>Control panel</small></span>
        </a>
      </nav>
    </div>
    <div class="drawer-footer"><span class="status-dot"></span> PhilosophersAPI · Online</div>
  </aside>

  <!-- Content -->
  <div class="main-shell">
    <div class="container">
      <header class="page-head animate-reveal">
        <h1><span class="brand-gradient-text">Wisdom of the Thinkers</span></h1>
        <div class="divider"></div>
        <p><span id="stat-count">—</span> Philosophers · Quotes · Key Ideas</p>
      </header>

      <div class="search-bar animate-reveal" style="animation-delay:0.1s;">
        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by name, school, or interest…" />
        </div>
      </div>

      <section class="quote-highlight glass animate-reveal" id="quoteHighlight" style="animation-delay:0.15s;">
        <button class="refresh-btn" id="refreshQuote" title="New quote">
          <i class="fas fa-sync-alt"></i>
        </button>
        <span class="label"><i class="fas fa-quote-left"></i> Quote of the Day</span>
        <blockquote id="quoteText">Loading…</blockquote>
        <div class="author" id="quoteAuthor">—</div>
        <span class="reference" id="quoteRef"></span>
      </section>

      <h2 class="grid-title">Featured Philosophers</h2>
      <section class="philosopher-grid" id="philosopherGrid">
        <div class="loading">▸ Loading philosophers…</div>
      </section>
    </div>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/philosophy.js"></script>
</body>
</html>
